<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamlet Havoc</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234a5d3a'/%3E%3Crect x='4' y='3' width='8' height='10' rx='1' fill='%23d4af37'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <div id="game">
      <canvas id="world"></canvas>

      <!-- HUD overlay (HTML/CSS, drawn above the canvas — see req §2.2) -->
      <div id="hud">
        <div id="hud-top">
          <span id="hud-season">Spring, Year 1</span>
          <span id="hud-timer">60s</span>
          <!-- Upcoming end-of-year event (req §16.4, §19.1) -->
          <span id="hud-event" title="Upcoming end-of-year event">Next: —</span>
          <span id="hud-paused" hidden>PAUSED</span>
        </div>
        <!-- Resource bar + pooled storage (req §19.1); cells filled in by hud.ts -->
        <div id="hud-resources">
          <span id="hud-storage" class="res-storage">Storage 0/0</span>
        </div>
        <!-- Population + equipment (req §7.4, §19.1) -->
        <div id="hud-status">
          <span id="hud-population">Pop W:0/0 · S+C:0/0 (S:0 C:0)</span>
          <span id="hud-equipment">Sword:0 · Shield:0</span>
        </div>
        <!-- Action panel: build buttons + context-sensitive unit/building actions. -->
        <!-- Populated by controls.ts; pointer-events enabled so buttons are clickable. -->
        <div id="action-panel"></div>
        <div id="hud-controls">
          <button id="btn-new" type="button">New</button>
          <button id="btn-save" type="button">Save</button>
          <button id="btn-load" type="button">Load</button>
        </div>
        <!-- Town marketplace interface (req §18): shown when a unit reaches town. -->
        <!-- Populated by ui/town.ts; pointer-events enabled so it's interactive. -->
        <div id="town-panel" hidden></div>
        <!-- Hall/storage load-unload interface (T9): shown when a built storage -->
        <!-- building is selected with a unit on/beside it. Populated by ui/hall.ts. -->
        <div id="hall-panel" hidden></div>
        <div id="hud-toast" hidden></div>
        <!-- Persistent combat alert (TODO.txt T2): bottom-centre banner, click to jump. -->
        <div id="hud-combat-alert" hidden></div>
        <!-- Stacked warning popups for sim events (unit lost/demoted, T7). -->
        <!-- Populated by hud.ts; each entry fades out on its own. -->
        <div id="hud-notifications"></div>
        <!-- Unit tooltip: shown on hover; positioned by hud.ts. -->
        <div id="unit-tooltip" hidden>
          <div id="tt-title"></div>
          <div id="tt-hp"></div>
          <div id="tt-order"></div>
          <div id="tt-carry" hidden></div>
        </div>
        <!-- Building tooltip: shown on hover (T10); positioned by hud.ts. -->
        <div id="building-tooltip" hidden>
          <div id="bt-title"></div>
          <div id="bt-body"></div>
        </div>
        <div id="hud-debug">
          <span id="hud-tick">tick 0</span>
        </div>
      </div>

      <!-- Year-end event modal (req §16.4) + game-over screen (req §21). A full -->
      <!-- overlay; populated by ui/events.ts when phase is EndOfYearEvent/GameOver. -->
      <div id="event-overlay" hidden>
        <div id="event-dialog"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
